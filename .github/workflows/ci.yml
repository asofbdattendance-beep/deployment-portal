name: CI

on:
  push:
    branches: ['*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      # Runs the full suite + enforces coverage thresholds (vite.config.js)
      - name: Tests & Coverage
        run: npm run test:coverage

      - name: Build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder-key
        run: npm run build

  # Mobile-first attendance gate (Pixel 5 + iPhone 13): bottom tab bar,
  # immersive scan shell, PWA contract. Desktop e2e stays out of CI by
  # design (14-test offline matrix is a manual pre-release check); the
  # mobile smoke is fast (~30s) and guards the phone layer on every push.
  e2e-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium webkit

      - run: npx playwright test --project=mobile-chrome --project=mobile-safari

  migration-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Migration parity (sql/ <-> supabase/migrations/)
        run: |
          set -eu
          fail=0

          # ---------------------------------------------------------------
          # sql/ is the reviewed source of truth; supabase/migrations/ is
          # what `supabase db push` actually applies. They must mirror each
          # other exactly, in both directions.
          #
          # Every versioned sql/v<ver>_<name>.sql is mirrored as
          # supabase/migrations/<slot>_v<ver>_<name>.sql.
          #
          # The FULL "v<ver>_<name>" marker is matched on purpose. Matching a
          # bare slot glob ("does 0040_*.sql exist?") is what made this a
          # false pass: sql/v39_attendance_analytics.sql looks for slot 0040,
          # and 0040_v38b_restore_schedule.sql satisfied the glob even when
          # 0042_v39_attendance_analytics.sql was missing -- so v39 could
          # vanish from every db push with CI green.
          #
          # Sub-versions (v38b, v38c) carry a trailing letter and are covered
          # by the same rule. They used to be skipped outright by a
          # *[!0-9]* guard and therefore got no parity check at all.
          # ---------------------------------------------------------------
          markers=''
          for f in sql/v[0-9]*_*.sql; do
            base=${f#sql/v}
            base=${base%.sql}
            ver=${base%%_*}
            name=${base#*_}
            case $ver in
              '' | *[!0-9a-z]*) continue ;;
            esac
            marker="v${ver}_${name}.sql"
            markers="${markers}${marker}"$'\n'

            found=''
            for c in supabase/migrations/*_"${marker}"; do
              [ -e "$c" ] || continue
              # assert the basename really carries the version marker
              case $(basename "$c") in
                *_"${marker}") found=$c; break ;;
              esac
            done

            if [ -z "$found" ]; then
              echo "missing counterpart: $f <-> supabase/migrations/*_${marker}"
              fail=1
              continue
            fi

            # A mirrored pair is byte-identical by design, so any difference
            # means one copy was edited without the other and db push would
            # apply something the repo does not document. Checked for every
            # pair in the same loop -- previously only two pairs were covered,
            # so v39<->0042 drift was invisible.
            #
            # These two are intentionally different:
            #   v24  sql/ redacts the ASO email/auth-uuid/password
            #   v26  sql/ additionally carries the scan_in timestamp
            #        validation, centre-spoofing guard and idempotent close
            case $ver in
              24 | 26) ;;
              *)
                if ! diff -q "$f" "$found" >/dev/null 2>&1; then
                  echo "content drift: $f differs from $found"
                  fail=1
                fi
                ;;
            esac
          done

          # Reverse direction: a migration with no sql/ source was never
          # reviewed and still gets applied by db push.
          for m in supabase/migrations/*.sql; do
            tail=$(basename "$m")
            tail=${tail#*_}
            if [ "$tail" = 'portal_setup.sql' ]; then
              if [ ! -f sql/portal_setup.sql ]; then
                echo "missing source: $m <-> sql/portal_setup.sql"
                fail=1
              fi
              continue
            fi
            if ! printf '%s' "$markers" | grep -qxF "$tail"; then
              echo "missing source: $m <-> sql/v*_${tail}"
              fail=1
            fi
          done

          if [ "$fail" -ne 0 ]; then
            echo "migration-parity check FAILED"
            exit 1
          fi
          echo "migration-parity check passed"

  # The parity job proves sql/ and supabase/migrations/ mirror each other. It
  # cannot prove a file PARSES: v53 shipped with `dp_s ewadars` — a space inside
  # the identifier — inside its BEGIN/COMMIT block, so the whole transaction
  # rolled back, `is_my_incharge_dept_badge` never existed, and a
  # `supabase db push` chain halted before v54. CI was green the entire time.
  #
  # This job applies the chain to a real Postgres instead, which catches both
  # syntax errors and the semantic kind (a policy that references a function
  # the previous migration never created).
  migration-apply:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - name: Apply the migration chain to a scratch database
        env:
          PGPASSWORD: postgres
        run: |
          set -eu
          for i in $(seq 1 30); do pg_isready -h localhost -U postgres >/dev/null && break; sleep 1; done
          psql -h localhost -U postgres -q -c 'drop database if exists gate' -c 'create database gate'

          # Minimal Supabase-shaped scaffolding. These migrations were written
          # against Supabase, which provides the auth/storage schemas, the
          # anon/authenticated/service_role roles and the realtime publication
          # before any of them run. Without this the chain fails for reasons
          # that have nothing to do with the migrations themselves.
          psql -h localhost -U postgres -d gate -v ON_ERROR_STOP=1 -q <<'SQL'
          create schema if not exists auth;
          create schema if not exists storage;
          create schema if not exists extensions;
          do $$ begin
            if not exists (select 1 from pg_roles where rolname='anon') then create role anon nologin; end if;
            if not exists (select 1 from pg_roles where rolname='authenticated') then create role authenticated nologin; end if;
            if not exists (select 1 from pg_roles where rolname='service_role') then create role service_role nologin; end if;
            if not exists (select 1 from pg_publication where pubname='supabase_realtime') then create publication supabase_realtime; end if;
          end $$;
          create or replace function auth.uid() returns uuid language sql stable as $$ select nullif(current_setting('request.jwt.claims', true),'')::uuid $$;
          create or replace function auth.role() returns text language sql stable as $$ select nullif(current_setting('request.jwt.claims', true),'') $$;
          create or replace function auth.jwt() returns jsonb language sql stable as $$ select nullif(current_setting('request.jwt.claims', true),'')::jsonb $$;
          create table if not exists auth.users (id uuid primary key default gen_random_uuid(), email text, encrypted_password text, instance_id uuid);
          create table if not exists auth.identities (id uuid primary key default gen_random_uuid(), user_id uuid, provider text, identity_data jsonb);
          create table if not exists storage.buckets (id text primary key, name text, public boolean);
          create table if not exists storage.objects (id uuid primary key default gen_random_uuid(), bucket_id text, name text, owner uuid, owner_id uuid, size bigint, mime_type text, created_at timestamptz, updated_at timestamptz, last_accessed_at timestamptz, metadata jsonb);
          create table if not exists public.sewadars (badge_number text primary key, sewadar_name text, centre text, department text, badge_status text, is_initiated boolean, gender text);
          create table if not exists public.centres (id uuid primary key default gen_random_uuid(), name text, parent_centre text);
          SQL

          # Applied in slot order — the same order `supabase db push` uses, and
          # the order the files are named for.
          #
          # TWO FILES ARE SKIPPED, because they are one-off DATA SYNCs against a
          # legacy public.users table that does not exist on a fresh database,
          # not re-runnable DDL:
          #   0024_v23_sync_portal_users_centre_admins.sql
          #   0025_v24_fix_jaipal_bhatia_aso.sql  (carries a redacted placeholder)
          for f in $(ls supabase/migrations/*.sql | sort); do
            case "$f" in
              *0024_v23_*|*0025_v24_*) echo "skip (one-off data sync): $f"; continue ;;
            esac
            echo "apply: $f"
            psql -h localhost -U postgres -d gate -v ON_ERROR_STOP=1 -q -f "$f"
          done

          # The two checks that matter. The first is v53's whole reason to exist;
          # the second is v54's — a silent miss there is a page that never
          # updates live, with nothing in the UI to say so.
          psql -h localhost -U postgres -d gate -v ON_ERROR_STOP=1 -tAc \
            "select 'is_my_incharge_dept_badge: '||count(*) from pg_proc where proname='is_my_incharge_dept_badge'"
          psql -h localhost -U postgres -d gate -v ON_ERROR_STOP=1 -tAc \
            "select 'realtime members: '||count(*) from pg_publication_tables where pubname='supabase_realtime'"

      # V2 live probe (COMMENT-ONLY — never executed by CI; a human runs it
      # as a scanner role against the live project to tell "v46 bug live"
      # apart from healthy). Paste both queries into an authenticated session
      # as a scanner (a scanner login — NOT the SQL editor, which carries no
      # portal role and is refused by the role gate by design):
      #
      #   SELECT public.scan_in(
      #     '<a-badge-with-no-open-session>',
      #     '<the-schedule-uuid>',
      #     now(),
      #     'live-probe-' || gen_random_uuid()::text);
      #   -- healthy: {"ok": true, "undeployed": ..., "sewadar_name": ...}
      #   -- v46 bug live: ERROR: Already IN — OUT first (open since <null> <null>)
      #   --   (the all-NULL row's FOUND=true fires the ladder with nothing open;
      #   --    note the null date/time — no real session exists)
      #
      #   SELECT public.scan_in(
      #     '<the-same-badge>', '<the-schedule-uuid>', now(),
      #     'live-probe-' || gen_random_uuid()::text);
      #   -- healthy AND buggy: ERROR: Already IN — OUT first (open since <date> <time>)
      #   --   (a real OPEN row exists now, so both guards fire)
      #
      # Read the pair together: first-call-ok + second-call-Already-IN =
      # healthy v56; first-call-Already-IN-with-null-dates = v46 bug live.
      - name: Call-level scan_in red/green gate (Track 1 V1)
        env:
          PGPASSWORD: postgres
        run: |
          set -eu
          # Pre-conditions (documented — the gate is only meaningful when all hold):
          #   fresh `gate` database from the step above (no OPEN session for the
          #   probe badge), an open schedule, a sewadar row with a valid badge,
          #   and a scanner login impersonated via request.jwt.claims (the CI
          #   auth.uid() scaffold reads that setting). Healthy => the first
          #   scan_in returns ok:true; the v46 `IF FOUND` ladder instead raises
          #   'Already IN' on that first call, which fails this step
          #   (ON_ERROR_STOP=1 turns the RAISE into a red build).
          psql -h localhost -U postgres -d gate -v ON_ERROR_STOP=1 -q <<'SQL'
          INSERT INTO auth.users(id, email)
          VALUES ('11111111-1111-1111-1111-111111111111', 'ci-scanner@example.com');
          INSERT INTO public.portal_users(auth_id, name, role, centre, is_active)
          VALUES ('11111111-1111-1111-1111-111111111111', 'CI Scanner', 'scanner', 'CI CENTRE', true);
          INSERT INTO public.deployment_schedules(id, name, status)
          VALUES ('22222222-2222-2222-2222-222222222222', 'CI gate', 'open');
          INSERT INTO public.sewadars(badge_number, sewadar_name, centre)
          VALUES ('VSCIGATE01', 'CI Gate', 'CI CENTRE');
          SET request.jwt.claims = '11111111-1111-1111-1111-111111111111';
          DO $$
          DECLARE
            r jsonb;
            c_sched uuid := '22222222-2222-2222-2222-222222222222';
          BEGIN
            -- First scan of a badge with NO open session must succeed.
            r := public.scan_in('VSCIGATE01', c_sched, now(), 'ci-gate-nonce-001');
            IF COALESCE(r->>'ok', '') <> 'true' THEN
              RAISE EXCEPTION 'scan_in gate RED: expected ok:true on first scan, got %', r;
            END IF;
            -- Second scan (different nonce, session now OPEN) must raise the ladder.
            BEGIN
              PERFORM public.scan_in('VSCIGATE01', c_sched, now(), 'ci-gate-nonce-002');
              RAISE EXCEPTION 'scan_in ladder gate RED: second IN did not raise Already IN';
            EXCEPTION WHEN OTHERS THEN
              IF SQLERRM NOT LIKE '%Already IN%' THEN
                RAISE EXCEPTION 'scan_in ladder gate RED: wrong error on second IN: %', SQLERRM;
              END IF;
            END;
            RAISE NOTICE 'scan_in gate GREEN: first IN ok:true, second IN raised Already IN';
          END $$;
          SQL
