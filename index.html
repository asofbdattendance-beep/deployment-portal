<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Sewadar consent & deployment portal — manage schedules, consent, and department allocation across centres." />
    <meta name="theme-color" content="#6366f1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1e1b4b" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Sewadar Portal" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Deployment Portal</title>
    <script>
      // Capture beforeinstallprompt BEFORE the module bundle runs — the event
      // can fire during parse, and a useEffect listener mounts too late.
      ;(function () {
        window.__portalInstallEvent = null
        window.addEventListener('beforeinstallprompt', function (e) {
          try { e.preventDefault() } catch (_) { /* ignore */ }
          if (!window.__portalInstallEvent) window.__portalInstallEvent = e
          window.dispatchEvent(new CustomEvent('portal-bip'))
        })
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>This portal requires JavaScript. Please enable it to continue.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
